<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenge - Batch15 Challenges</title>
  <meta name="description" content="Take a challenge and test your skills.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-brand">Batch15 Challenges</a>
      <button class="navbar-back" id="backBtn">&larr; Exit Challenge</button>
    </div>
  </nav>

  <div class="challenge-page" id="challengePage">
    <aside class="challenge-sidebar" id="challengeSidebar">
      <div id="sidebarContent">
        <div class="loading">Loading...</div>
      </div>
    </aside>
    <main class="challenge-main" id="challengeMain">
      <div id="challengeContent">
        <div class="loading">Loading challenge...</div>
      </div>
    </main>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Warning Overlay (Tab Switch / Inactivity) -->
  <div id="warningOverlay" class="warning-overlay" style="display:none;">
    <div class="warning-overlay-content">
      <div class="icon">&#x26A0;&#xFE0F;</div>
      <h2 id="warningTitle">Warning!</h2>
      <p id="warningMessage">You have left the challenge page.</p>
      <div class="warning-count" id="warningCount">Warning <span id="warningNum">1</span> of <span id="warningMax">3</span></div>
      <button class="btn btn-primary" id="warningDismiss">Return to Challenge</button>
    </div>
  </div>

  <!-- Anti-Cheat Speed Block Overlay -->
  <div id="speedBlockOverlay" class="warning-overlay" style="display:none;">
    <div class="warning-overlay-content">
      <div class="icon">&#x23F3;</div>
      <h2>Answering Too Fast!</h2>
      <p>Your answers are being submitted too quickly. Please wait before continuing.</p>
      <div id="speedBlockTimer" style="font-size:2rem;font-weight:700;color:var(--danger);margin-bottom:16px;">5</div>
      <p style="font-size:0.85rem;color:var(--text-light);">You can continue when the timer reaches 0.</p>
    </div>
  </div>

  <!-- Results Modal -->
  <div id="resultsModalOverlay" class="modal-overlay" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h2>Challenge Results</h2>
        <button class="modal-close" id="resultsClose">&times;</button>
      </div>
      <div class="modal-body" id="resultsBody"></div>
      <div class="modal-footer">
        <button class="btn btn-outline" id="resultsCloseBtn">Close</button>
        <button class="btn btn-primary" id="certificateBtn">Get Certificate</button>
      </div>
    </div>
  </div>

  <!-- Certificate Modal -->
  <div id="certModalOverlay" class="modal-overlay" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h2 id="certModalTitle">Your Certificate</h2>
        <button class="modal-close" id="certClose">&times;</button>
      </div>
      <div class="modal-body" id="certBody">
        <div id="certFormSection">
          <form class="cert-form" id="certForm">
            <div class="form-group">
              <label for="firstName">First Name</label>
              <input type="text" id="firstName" required placeholder="Enter your first name">
            </div>
            <div class="form-group">
              <label for="secondName">Second Name</label>
              <input type="text" id="secondName" required placeholder="Enter your second name">
            </div>
            <div class="form-group">
              <label for="thirdName">Third Name</label>
              <input type="text" id="thirdName" required placeholder="Enter your third name">
            </div>
            <div class="form-group">
              <label for="studentPic">Upload Picture</label>
              <input type="file" id="studentPic" class="file-input" accept="image/*">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Generate Certificate</button>
          </form>
        </div>
        <div id="certDisplaySection" style="display:none;"></div>
      </div>
      <div class="modal-footer" id="certFooter" style="display:none;">
        <button class="btn btn-outline" id="certPrint">&#x1F5A8; Print</button>
        <button class="btn btn-secondary" id="certDownloadPdf">&#x1F4C4; Download PDF</button>
        <button class="btn btn-secondary" id="certDownloadPng">&#x1F4F7; Download PNG</button>
        <button class="btn btn-primary" id="certShare">&#x1F517; Share</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/challenge.js"></script>
</body>
</html>
