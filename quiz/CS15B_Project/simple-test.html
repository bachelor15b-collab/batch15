<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Test Skills</title>
<style>
body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f0f0f0; color: #333; }
h1 { color: #2563eb; text-align: center; }
.skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 10px; margin-top: 20px; }
.skill { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 15px; text-align: center; cursor: pointer; }
.skill:hover { border-color: #2563eb; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.skill .name { font-size: 13px; font-weight: 600; margin-top: 5px; }
.error { background: #fee2e2; color: #991b1b; padding: 15px; border-radius: 8px; margin: 20px 0; text-align: center; }
</style>
</head>
<body>
<h1>Batch15 Challenges</h1>
<p style="text-align:center;color:#666;">Test - Skills should appear below</p>
<div class="skills" id="skillsGrid">Loading...</div>
<script>
var skillsList = [
  { icon: "??", name: "Mobile Repairing" },
  { icon: "???", name: "Computer Repairing" },
  { icon: "??", name: "Networking" },
  { icon: "??", name: "Programming" },
  { icon: "??", name: "Database Admin" },
  { icon: "??", name: "Web Development" },
  { icon: "??", name: "Cloud Computing" },
  { icon: "??", name: "AI" },
  { icon: "??", name: "Data Science" },
  { icon: "??", name: "UI/UX Design" },
  { icon: "??", name: "Cyber Security" },
  { icon: "??", name: "Python" }
];

try {
  var g = document.getElementById('skillsGrid');
  if (!g) throw new Error('skillsGrid NOT found');
  g.innerHTML = '';
  for (var i = 0; i < skillsList.length; i++) {
    var s = skillsList[i];
    var d = document.createElement('div');
    d.className = 'skill';
    d.innerHTML = '<div style="font-size:28px;">' + s.icon + '</div><div class="name">' + s.name + '</div>';
    g.appendChild(d);
  }
  document.title = skillsList.length + ' Skills Loaded';
} catch(e) {
  document.getElementById('skillsGrid').innerHTML = '<div class="error">ERROR: ' + e.message + '</div>';
}
</script>
</body>
</html>
